<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Фон -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Центральная мачта -->
  <line x1="16" y1="29" x2="16" y2="5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Навершие (Т-образный кончик) -->
  <line x1="13" y1="6" x2="19" y2="6" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Поперечина верхняя -->
  <line x1="7" y1="11" x2="25" y2="11" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Поперечина нижняя -->
  <line x1="9" y1="16" x2="23" y2="16" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Подкосы к верхней поперечине -->
  <line x1="16" y1="9" x2="7"  y2="11" stroke="#7dd3fc" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="9" x2="25" y2="11" stroke="#7dd3fc" stroke-width="1" stroke-linecap="round"/>

  <!-- Подкосы к нижней поперечине -->
  <line x1="16" y1="14" x2="9"  y2="16" stroke="#7dd3fc" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="23" y2="16" stroke="#7dd3fc" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Ноги (раскос книзу) -->
  <line x1="16" y1="21" x2="10" y2="29" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="22" y2="29" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Горизонталь основания -->
  <line x1="10" y1="29" x2="22" y2="29" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Провода -->
  <path d="M7,11 Q11.5,14.5 16,13.5 Q20.5,12.5 25,11" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
  <path d="M9,16 Q12.5,19 16,18 Q19.5,17 23,16" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
</svg>
